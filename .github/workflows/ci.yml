name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest

      - name: Python lint
        run: |
          cd backend
          make lint

      - name: Python tests
        run: |
          cd backend
          make test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt
        run: |
          cd infra/terraform
          terraform fmt -check

      - name: Terraform validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
